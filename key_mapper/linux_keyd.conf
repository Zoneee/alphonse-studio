# 对应 windows_autoHotKey.ahk 的 Linux keyd 配置。
# 启用时可链接到 /etc/keyd/default.conf，然后运行 `sudo keyd reload`。
# 通配符会将映射应用到 keyd 管理的所有键盘。

[ids]
*

[main]
# 输出字面字符 U+0060，与 AHK 的反引号映射一致。
# X11 Unicode 输出需要通过 XCompose 加载 keyd.compose；本机可运行：
# `ln -s /usr/local/share/keyd/keyd.compose ~/.XCompose`
# 当前输入法仍可能拦截 Compose 序列。
grave = `
capslock = enter

# keyd 只负责重映射输入事件；以下 AHK 动作需要桌面或应用配合，未在此实现：
# Alt+Escape：最小化当前窗口。
# Super+1：打开 Windows 路径 D:\W_workflower。
# Super+Shift+Enter：切换当前窗口的置顶状态。

[alt]
# Alt + IJKL：方向键；Alt + UO：Home / End。
j = left
l = right
i = up
k = down
u = home
o = end

# Alt + WASD：Shift + 方向键；Alt + QE：Shift + Home / End。
w = S-up
s = S-down
a = S-left
d = S-right
q = S-home
e = S-end

# Alt + M/N：Delete / Backspace。
m = delete
n = backspace

# AHK 源码这里发送 10 次方向键（不是鼠标移动）。
7 = macro(left left left left left left left left left left)
9 = macro(right right right right right right right right right right)

[control]
# 将 Ctrl+R 映射为 Ctrl+O。
r = C-o

[control+alt]
# 保留 Ctrl 修饰键，实现按词移动。
j = C-left
l = C-right

[meta+shift]
# Super+Shift+Insert 输出与 AHK 一致的字面反引号。
insert = `
